<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golive Squad</title>
  <meta name="description" content="__OG_DESC__">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Golive">
  <meta property="og:title" content="__OG_TITLE__">
  <meta property="og:description" content="__OG_DESC__">
  <meta property="og:url" content="__OG_URL__">
  <meta property="og:image" content="__OG_IMAGE__">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="__OG_TITLE__">
  <meta name="twitter:description" content="__OG_DESC__">
  <meta name="twitter:image" content="__OG_IMAGE__">

  <link rel="icon" type="image/png" href="/favicon.png">

</head>
<body class="squad-page">
  <header>
    <div class="header-content">
      <div class="header-titles">
        <h1 data-i18n="squad.title">Golive Squad</h1>
        <p class="sub" data-i18n="squad.tagline">Watch several rooms side by side. Only one has sound at a time.</p>
      </div>
      <div class="header-actions">
        <select id="langSelect" class="lang-select" data-lang-select data-i18n-aria-label="app.language" aria-label="Language"></select>
      </div>
    </div>
  </header>

  <main>
    <form class="squad-add" id="squadForm" autocomplete="off">
      <input id="squadInput" type="text" spellcheck="false" autocapitalize="off" maxlength="512" data-i18n-placeholder="squad.placeholder" placeholder="room code or /watch/… link" data-i18n-aria-label="squad.placeholder" aria-label="Room code or link">
      <button class="primary" type="submit" data-i18n="squad.add">Add</button>
      <button class="btn-ghost" type="button" id="squadCopyBtn" data-i18n-title="squad.copyLink" title="Copy link" data-i18n="squad.copyLink">Copy link</button>
    </form>
    <p class="home-note squad-error" id="squadError" hidden data-i18n="squad.invalidCode">Use a room code or paste a Golive link.</p>
    <p class="squad-note" data-i18n="squad.limit">Many rooms at once tax the CPU and the connection — 2 to 4 is usually comfortable.</p>

    <p class="squad-empty" id="squadEmpty" data-i18n="squad.empty" hidden>No rooms yet. Add a code above or paste a Golive link.</p>

    <div class="squad-grid" id="squadGrid" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <a class="icon-btn" href="https://github.com/dener-p/golive" target="_blank" rel="noopener noreferrer" data-i18n-title="report.github" data-i18n-aria-label="report.github" title="GitHub repository" aria-label="GitHub repository">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <button class="icon-btn" type="button" data-report-bug data-i18n-title="report.action" data-i18n-aria-label="report.action" title="Report a bug" aria-label="Report a bug">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
    </button>
  </footer>

  <script src="/i18n.js"></script>
  <script src="/squad.js"></script>
  <script src="/report.js"></script>
</body>
</html>
